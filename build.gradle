plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'com.heconis.dmlcompanion'
version = '0.3.16'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            // Map dependency mixin references from production SRG names into the development mappings.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath
            mods {
                dmlcompanion { source sourceSets.main }
            }
        }
        client {
            workingDirectory project.file('run')
        }
        server {
            workingDirectory project.file('run-server')
            args '--nogui'
        }
    }
}

repositories {
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    implementation fg.deobf('curse.maven:dragon-mounts-legacy-375088:5335579')
    implementation fg.deobf('curse.maven:curios-309927:6418456')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'modVersion', project.version
    filesMatching('META-INF/mods.toml') {
        expand modVersion: project.version
    }
}

tasks.named('jar').configure {
    finalizedBy 'reobfJar'
}

def checkDragonStorage = tasks.register('checkDragonStorage', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.heconis.dmlcompanion.DragonStorageDataCheck'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    workingDir = layout.buildDirectory.get().asFile
}

tasks.named('check').configure {
    dependsOn checkDragonStorage
}
